services:
  - type: web
    name: reachinbox-scheduler-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        value: file:./dev.db
      - key: WORKER_CONCURRENCY
        value: 5
      - key: MIN_DELAY_BETWEEN_EMAILS_SECONDS
        value: 2
      - key: MAX_EMAILS_PER_HOUR_PER_SENDER
        value: 200

  - type: web
    name: reachinbox-scheduler-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
